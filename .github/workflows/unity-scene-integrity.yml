name: Unity scene integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: lfs.fetchinclude
          GIT_CONFIG_VALUE_0: Assets/ROM/**/*.unity
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python Tools/validate_unity_scenes.py --revision HEAD
