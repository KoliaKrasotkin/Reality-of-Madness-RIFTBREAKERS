">Pendiente física máxima medida: 18,92°.</text><text x="750" y="620">No se modifica la cámara final ni los puentes de Etapa 5.</text><text x="750" y="650">Ver Informe.md para evidencias nativas y límites de recepción.</text><path d="M90 800 V735 M82 748 L90 735 L98 748" fill="none" stroke="white" stroke-width="2"/><text x="108" y="755">N +Z</text><text x="85" y="835">E +X → · Planta: 9 px/m</text><text x="35" y="910">Verde: ruta inspeccionada. Oro: protecciones. Ocre claro: ampliaciones locales. Cuatro jugadores reales: pendiente.</text><rect x="210.70000000000002" y="200.25000000000003" width="12.6" height="12.6" fill="none" stroke="#ff8585" stroke-width="2"/><rect x="220.15" y="470.7" width="12.6" height="12.6" fill="none" stroke="#ff8585" stroke-width="2"/><text class="small" x="750" y="695">Rojo: 2 margenes NavMesh Not Walkable de 1,4 x 1,4 m.</text></svg>