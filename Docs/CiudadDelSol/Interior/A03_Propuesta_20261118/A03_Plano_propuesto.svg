<text x="815" y="130" font-size="18">01 — Materiales locales</text><text class="small" x="815" y="155">Piedra mate oscurecida; sin cambiar geometría.</text>
<text x="815" y="213" font-size="18">02/03 — Memoria solar y advertencia</text><text class="small" x="815" y="238">Relieve roto y texto breve adosados a piedra.</text>
<text x="815" y="296" font-size="18">04 — Cierre abandonado</text><text class="small" x="815" y="321">Anclajes en jambas; nada cruza el hueco.</text>
<text x="815" y="379" font-size="18">05 — Una sola cicatriz violeta</text><text class="small" x="815" y="404">Acento pequeño; no portal ni nueva mecánica.</text>
<text x="815" y="462" font-size="18">06 — Guía cálida de salida</text><text class="small" x="815" y="487">Luminaria suspendida al techo real, fuera del eje.</text>
<text x="815" y="545" font-size="18">07 — Vestigio del pavimento</text><text class="small" x="815" y="570">Tratamiento visual sin resalto ni collider.</text>
<text x="815" y="628" font-size="18">08 — Linterna apagada</text><text class="small" x="815" y="653">Sobre soporte existente; omitir si no cabe.</text>
<text class="small" x="80" y="117">Hacia R21 por rodeo norte recibido ←</text>
<text x="780" y="805">Azul: eje recibido, no anchura cooperativa certificada.</text><text x="780" y="833">Gris discontinuo: llegada documental AC04.</text><text x="780" y="861">No añadir objetos sólidos al piso libre.</text>
<text x="35" y="932">Las barandas se representan de forma esquemática. Sus colliders originales no se modifican ni se sustituyen por versiones rotas.</text><text x="35" y="959">Los puntos de montaje son propuestas: ajustar a superficie, apoyo, normal y techo reales antes de guardar una construcción.</text><text x="35" y="986">El dibujo no amplía A03 ni acredita toda su envolvente. La circulación con cuatro jugadores reales continúa pendiente.</text></svg>