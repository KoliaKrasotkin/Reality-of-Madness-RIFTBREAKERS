<text x="35" y="891">Las proporciones del arco son ilustrativas. Se reutilizará el arco real; no se reemplaza por este esquema.</text><text x="35" y="922">No hay cadenas en el paso, escombros en el suelo, nueva puerta funcional ni alteración de NavMesh.</text></svg>