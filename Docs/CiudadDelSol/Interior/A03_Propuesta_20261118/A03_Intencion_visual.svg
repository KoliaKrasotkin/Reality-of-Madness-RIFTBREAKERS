<rect x="595" y="778" width="135" height="34" rx="4" fill="#B1A48B" stroke="#777"/><text class="small" x="595" y="835">Grabado · #B1A48B</text>
<rect x="775" y="778" width="135" height="34" rx="4" fill="#1D2630" stroke="#777"/><text class="small" x="775" y="835">Sombra · #1D2630</text>
<rect x="955" y="778" width="135" height="34" rx="4" fill="#C6954B" stroke="#777"/><text class="small" x="955" y="835">Ámbar · #C6954B</text>
