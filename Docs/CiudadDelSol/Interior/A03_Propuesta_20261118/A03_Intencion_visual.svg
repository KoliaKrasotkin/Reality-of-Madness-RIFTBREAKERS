<text x="945" y="140" font-size="20">No es el exterior</text><text class="small" x="945" y="169">Piedra mate, hollín y bronce apagado.</text>
<text x="945" y="250" font-size="20">Sin relato impuesto</text><text class="small" x="945" y="279">Advertencias y cierres como sugerencia.</text>
<text x="945" y="360" font-size="20">Violeta con medida</text><text class="small" x="945" y="389">Una fractura; la sala no se tiñe entera.</text>
<text x="945" y="470" font-size="20">Silencio y ausencia</text><text class="small" x="945" y="499">Luz residual y objetos abandonados.</text>
<text x="945" y="580" font-size="20">Paso reconocible</text><text class="small" x="945" y="609">La salida este conserva su lectura.</text>
